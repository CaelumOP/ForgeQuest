# Builds the Android app in the cloud, so no PC is needed.
# - Every PR push: unit tests + release APK (downloadable from the run's "Artifacts").
# - Every merge to main: same build, then commits the signed APK to apk/ForgeQuest.apk, but only when
#   versionCode matches apk/version.json, the APK is signed with the same key as the one already committed,
#   and the committed APK is older. Signing key comes from repo secrets (see docs/SETUP.md → Cloud builds).
name: Android build

on:
  pull_request:
    paths-ignore: ["apk/**", "web/**", "**.md"]
  push:
    branches: [main]
    paths-ignore: ["apk/**", "web/**", "**.md"]
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: write # only used by the "Commit APK" and "GitHub Release" steps, which run on main only
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Set up release signing
        id: signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "::warning::Signing secrets are missing, so this APK is signed with the debug key and won't be published."
            echo "signed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          esc() { local v="${1//\\/\\\\}"; printf '%s' "$v"; } # .properties treats \ as an escape
          {
            echo "storeFile=$RUNNER_TEMP/release.jks"
            echo "storePassword=$(esc "$KEYSTORE_PASSWORD")"
            echo "keyAlias=$(esc "$KEY_ALIAS")"
            echo "keyPassword=$(esc "$KEY_PASSWORD")"
          } > keystore.properties
          echo "signed=true" >> "$GITHUB_OUTPUT"

      - name: Unit tests and release build
        run: ./gradlew --stacktrace testDebugUnitTest assembleRelease

      - name: Remove signing files
        if: always()
        run: rm -f keystore.properties "$RUNNER_TEMP/release.jks"

      - name: Read APK version and signer
        id: apk
        run: |
          # Compare against the newest committed APK: an earlier queued run may have published since this checkout.
          if [ "$GITHUB_EVENT_NAME" = push ] && [ "$GITHUB_REF" = refs/heads/main ]; then git pull --ff-only origin main; fi
          BT="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)"
          NEW=app/build/outputs/apk/release/app-release.apk
          code() { "$BT/aapt2" dump badging "$1" | sed -n "s/.*versionCode='\([0-9]*\)'.*/\1/p"; }
          cert() { "$BT/apksigner" verify --print-certs "$1" | sed -n 's/.*certificate SHA-256 digest: //p' | head -1; }
          echo "built=$(code "$NEW")" >> "$GITHUB_OUTPUT"
          echo "json=$(jq -r .versionCode apk/version.json)" >> "$GITHUB_OUTPUT"
          echo "committed=$(code apk/ForgeQuest.apk || echo 0)" >> "$GITHUB_OUTPUT"
          echo "newcert=$(cert "$NEW")" >> "$GITHUB_OUTPUT"
          echo "oldcert=$(cert apk/ForgeQuest.apk || true)" >> "$GITHUB_OUTPUT"

      - name: Summary
        run: |
          {
            echo "### ForgeQuest APK"
            echo "- Built versionCode: ${{ steps.apk.outputs.built }} (apk/version.json says ${{ steps.apk.outputs.json }}, committed APK is ${{ steps.apk.outputs.committed }})"
            echo "- Signed with release key: ${{ steps.signing.outputs.signed }}"
            echo "- Same signer as committed APK: ${{ steps.apk.outputs.newcert == steps.apk.outputs.oldcert }}"
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: ForgeQuest-${{ steps.apk.outputs.built }}
          path: app/build/outputs/apk/release/app-release.apk
          retention-days: 14

      - name: Commit APK to main
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          SIGNED: ${{ steps.signing.outputs.signed }}
          BUILT: ${{ steps.apk.outputs.built }}
          JSON: ${{ steps.apk.outputs.json }}
          COMMITTED: ${{ steps.apk.outputs.committed }}
          NEWCERT: ${{ steps.apk.outputs.newcert }}
          OLDCERT: ${{ steps.apk.outputs.oldcert }}
        run: |
          if [ "$SIGNED" != "true" ]; then echo "::error::Signing secrets missing, not publishing a debug-signed APK."; exit 1; fi
          if [ -n "$OLDCERT" ] && [ "$NEWCERT" != "$OLDCERT" ]; then
            echo "::error::Built APK is signed with a different key than apk/ForgeQuest.apk, so phones would refuse the update. Check the KEYSTORE secrets."; exit 1
          fi
          if [ "$BUILT" != "$JSON" ]; then
            echo "::notice::versionCode $BUILT doesn't match apk/version.json ($JSON). Not a release, APK left as is."; exit 0
          fi
          if [ "$BUILT" -le "${COMMITTED:-0}" ]; then
            echo "::notice::apk/ForgeQuest.apk is already versionCode $COMMITTED. Nothing to publish."; exit 0
          fi
          cp app/build/outputs/apk/release/app-release.apk apk/ForgeQuest.apk
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f apk/ForgeQuest.apk
          git commit -m "Publish APK versionCode $BUILT [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main
          echo "::notice::Published versionCode $BUILT to apk/ForgeQuest.apk"

      - name: GitHub Release for the published version
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Runs after "Commit APK to main", so a version published by this run or an earlier one gets its release.
          NAME=$(jq -r .versionName apk/version.json)
          JSON=$(jq -r .versionCode apk/version.json)
          BT="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)"
          COMMITTED=$("$BT/aapt2" dump badging apk/ForgeQuest.apk | sed -n "s/.*versionCode='\([0-9]*\)'.*/\1/p")
          if [ "$COMMITTED" != "$JSON" ]; then echo "::notice::apk/ForgeQuest.apk ($COMMITTED) isn't version.json's $JSON yet. No release."; exit 0; fi
          if gh release view "v$NAME" >/dev/null 2>&1; then echo "::notice::Release v$NAME already exists."; exit 0; fi
          cp apk/ForgeQuest.apk "$RUNNER_TEMP/ForgeQuest-v$NAME.apk"
          jq -r .notes apk/version.json > "$RUNNER_TEMP/notes.md"
          gh release create "v$NAME" "$RUNNER_TEMP/ForgeQuest-v$NAME.apk" --title "ForgeQuest v$NAME" --notes-file "$RUNNER_TEMP/notes.md" --target main
          echo "::notice::Published GitHub Release v$NAME"
